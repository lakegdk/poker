// ---- 本机去过的房间（退出/解散后还能找回积分）----
function getMyRooms(){
  try { return JSON.parse(localStorage.getItem('pk_rooms') || '[]'); } catch(e){ return []; }
}
function noteMyRoom(id, modeName){
  if(!id) return;
  let list = getMyRooms();
  const cur = list[0];
  // 同一个房间短时间内重复渲染就不再写盘，省掉无谓的 localStorage 写入
  if(cur && cur.id === id && cur.mode === (modeName||'') && (Date.now() - (cur.ts||0) < 60000)) return;
  list = list.filter(r => r.id !== id);
  list.unshift({ id, ts: Date.now(), mode: modeName || '' });
  try { localStorage.setItem('pk_rooms', JSON.stringify(list.slice(0, 10))); } catch(e){}
}
// 服务端返回的最近房间（带「我」的名次/总分）；本地列表只做兜底和补全
let histRows = null;

function histListItems(){
  const local = getMyRooms();
  const srv = histRows || [];
  const seen = new Set();
  const out = [];
  srv.forEach(r=>{
    seen.add(r.roomId);
    out.push({ roomId:r.roomId, modeName:r.modeName||'', ts:r.updatedAt||0,
      rounds:r.rounds||0, myScore:(r.myScore===null||r.myScore===undefined)?null:r.myScore, myRank:r.myRank||0 });
  });
  // 存档已被清理（超过 10 个房间 / 7 天）但本机还去过的房间：仍列出来，只是没有分数
  local.forEach(r=>{
    if(seen.has(r.id)) return;
    out.push({ roomId:r.id, modeName:r.mode||'', ts:r.ts||0, rounds:0, myScore:null, myRank:0 });
  });
  return out;
}

function renderHist(ask){
  const list = histListItems();
  const box = document.getElementById('histList');
  box.innerHTML = list.length ? list.map(r=>{
    const has = r.myScore !== null;
    const cls = has ? (r.myScore > 0 ? ' up' : (r.myScore < 0 ? ' down' : '')) : '';
    const rk = (has && r.myRank) ? '<i class="hr">第'+r.myRank+'</i>' : '';
    const sc = has ? '<i class="hs'+cls+'">'+(r.myScore>=0?'+':'')+r.myScore+'</i>' : '<i class="hs" style="opacity:.45">—</i>';
    return '<div class="hist-item" data-id="'+esc(r.roomId)+'"><b>'+esc(r.roomId)+'</b>'+
      '<span>'+esc(r.modeName||'')+' · '+histTime(r.ts)+(r.rounds?(' · '+r.rounds+'局'):'')+'</span>'+
      rk + sc + '<em>查看 ›</em></div>';
  }).join('') : '<div class="exp-empty">本机还没有战绩记录</div>';

  const sum = document.getElementById('histSum');
  if(sum){
    const scored = list.filter(r=>r.myScore !== null);
    if(!scored.length){
      sum.innerHTML = list.length ? '这里只列房间；该房间的存档已过保留期（最近 10 个房间 / 7 天），分数查不到了' : '';
    } else {
      const total = scored.reduce((a,b)=>a+b.myScore, 0);
      const wins = scored.filter(r=>r.myScore > 0).length;
      const loses = scored.filter(r=>r.myScore < 0).length;
      const draws = scored.length - wins - loses;
      const tally = '赢 ' + wins + ' / 输 ' + loses + (draws ? ' / 平 ' + draws : '');
      sum.innerHTML = '最近 <b>'+scored.length+'</b> 个房间合计 <b>'+(total>=0?'+':'')+total+'</b> 分' +
        '（'+tally+'）· 行尾数字是我在该房间的总分';
    }
  }

  box.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick = ()=>{ toggle('histBox', false); sendMsg({t:'roomHistory', clientId, roomId: el.dataset.id}); };
  });
  if(ask) sendMsg({t:'roomHistoryList', clientId});   // 向服务端要「我」的分数
}
function histTime(ts){
  if(!ts) return '';
  const d = new Date(ts); const p = n => (n<10?'0':'')+n;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
document.getElementById('btnHistory').onclick = ()=>{ histRows = null; renderHist(true); toggle('histBox', true); };

// ===== 微信内打开 / 加到主屏 引导 =====
(function(){
  try {
    const ua = navigator.userAgent || '';
    const inWx = /MicroMessenger/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    const wxTip = document.getElementById('wxTip');
    const pwaTip = document.getElementById('pwaTip');
    const wxText = document.getElementById('wxTipText');
    const pwaText = document.getElementById('pwaTipText');
    if (inWx) {
      // 微信内：iOS 无法「在浏览器打开」，统一引导用相机扫码 + 加到主屏
      if (wxText) wxText.innerHTML = isIOS
        ? '在 <b>微信</b> 里会占用微信且 iOS 无法跳浏览器。请用 <b>iPhone 相机</b> 扫码（别用微信扫）直接进 Safari，再 <b>分享 → 添加到主屏幕</b>，即可独立运行、切微信不丢。'
        : '当前在 <b>微信</b> 内会占用微信。点右上角 <b>···</b> → <b>在浏览器打开</b>，再 <b>菜单 → 添加到主屏幕</b>，即可独立运行。';
      if (wxTip) wxTip.classList.remove('hide');
    } else if (!standalone) {
      // 浏览器内但未加到主屏：主推「添加到主屏幕」（这才是能切后台不重载的关键）
      if (pwaText) pwaText.innerHTML = isIOS
        ? '建议 <b>分享 → 添加到主屏幕</b>：从桌面图标进入就是独立 App，切到微信再回来不会重载，也不占微信。'
        : '建议 <b>菜单 ⋮ → 添加到主屏幕</b>（或「安装应用」）：从桌面图标进入就是独立 App，切到微信再回来不会重载。';
      if (pwaTip && !localStorage.getItem('pk_pwa_tip')) pwaTip.classList.remove('hide');
    }
    const wxClose = document.getElementById('wxTipClose');
    if (wxClose) wxClose.onclick = () => { if (wxTip) wxTip.classList.add('hide'); };
    const pwaClose = document.getElementById('pwaTipClose');
    if (pwaClose) pwaClose.onclick = () => { if (pwaTip) pwaTip.classList.add('hide'); try { localStorage.setItem('pk_pwa_tip','1'); } catch(e){} };
  } catch(e){}
})();
