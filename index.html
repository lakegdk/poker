<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0e4b36" />
<title>扑克联机</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<!-- iOS 主屏独立全屏（不加会在 Safari 里带地址栏，且更易被卸载） -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="扑克联机" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;
    /* 安卓部分浏览器会给正文做「字体放大」，会把矮屏布局顶出可视区，这里关掉 */
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#06120e;color:#eaf3ee;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 高度优先级：--vh100(JS 实测可视高度) > 100dvh > 100vh
     安卓浏览器带底部工具栏时，100vh 是「工具栏收起后」的高度，比实际可视区高一截，
     底部的准备/出牌按钮就会被工具栏切掉；JS 会把真实高度写进 --vh100 兜住 */
  #app{position:relative;height:100vh;height:100dvh;height:var(--vh100,100dvh);overflow:hidden}
  .hidden{display:none!important}
  button{font-family:inherit}

  /* ---------- 牌桌底纹 ---------- */
  .felt{position:absolute;inset:0;overflow:hidden;
    background:
      radial-gradient(circle at 50% 34%, rgba(255,255,255,.07), rgba(255,255,255,0) 58%),
      radial-gradient(130% 100% at 50% 26%, #2fa574 0%, #1a7d56 30%, #0e4b36 64%, #062b20 100%);}
  .felt::after{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 200px 60px rgba(0,0,0,.62), inset 0 0 0 2px rgba(240,200,90,.10);}

  /* ---------- 扑克牌 ---------- */
  .c{
    position:relative;flex:0 0 auto;border-radius:calc(var(--w)*.11);
    width:var(--w);height:calc(var(--w)*1.42);
    font-size:calc(var(--w)*.30);
    background:linear-gradient(158deg,#ffffff 0%,#f7f9fb 55%,#e9eef3 100%);
    color:#16202e;user-select:none;-webkit-user-select:none;
    box-shadow:0 1px 2px rgba(0,0,0,.35),0 3px 9px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.95);
    transition:transform .12s ease,box-shadow .12s ease;
    overflow:hidden;
  }
  .c.red{color:#d5232f}
  .c .cc{position:absolute;top:5%;left:9%;display:flex;flex-direction:column;
    align-items:center;line-height:.95;font-weight:900;letter-spacing:-.03em}
  .c .cc b{font-size:1em}
  .c .cc i{font-size:.78em;font-style:normal;line-height:1;margin-top:.02em}
  .c .cs{position:absolute;right:7%;bottom:3%;font-size:1.5em;line-height:1;opacity:.9}
  .c.joker{background:linear-gradient(150deg,#fffdf5 0%,#ffeec2 50%,#f6d98a 100%)}
  .c.joker .jk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;font-weight:900;font-size:.92em;letter-spacing:.02em;color:#b8860b;line-height:1.02;text-align:center}
  .c.joker.red .jk{color:#d5232f}

  .c.back{
    background:linear-gradient(140deg,#3560b5 0%,#1f3d80 45%,#132a5c 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.30),0 1px 3px rgba(0,0,0,.45);
  }
  .c.back::before{content:"";position:absolute;inset:9%;border-radius:calc(var(--w)*.07);
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 2px,transparent 2px 6px),
      repeating-linear-gradient(-45deg,rgba(255,255,255,.13) 0 2px,transparent 2px 6px);
    border:1px solid rgba(255,255,255,.35)}

  /* ---------- 大厅 ---------- */
  #lobby{position:absolute;inset:0;display:flex;flex-direction:column;z-index:5}
  .lobby-inner{position:relative;display:flex;flex-direction:column;height:100%;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;width:100%}
  .topline{display:flex;align-items:center;gap:8px;font-size:12px;color:#c9e6d8}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:#f0c85a;box-shadow:0 0 6px #f0c85a}
  .dot.ok{background:#4ade80;box-shadow:0 0 6px #4ade80}
  .dot.err{background:#f87171;box-shadow:0 0 6px #f87171}
  .logo{text-align:center;margin:10px 0 6px}
  .fan{display:flex;justify-content:center;align-items:flex-end;height:70px;margin-bottom:8px}
  .fan .c{--w:46px;margin:0 -8px;transform-origin:bottom center;box-shadow:0 6px 16px rgba(0,0,0,.45)}
  .fan .c:nth-child(1){transform:rotate(-14deg) translateY(6px)}
  .fan .c:nth-child(2){transform:rotate(-5deg)}
  .fan .c:nth-child(3){transform:rotate(4deg) translateY(-2px);z-index:2}
  .fan .c:nth-child(4){transform:rotate(13deg) translateY(8px)}
  .logo h1{margin:0;font-size:27px;letter-spacing:.18em;font-weight:900;
    background:linear-gradient(180deg,#fff3c9,#e9c46a 55%,#c99a2e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .logo p{margin:6px 0 0;font-size:12px;color:#a9d3c0;letter-spacing:.14em}

  .sec-title{font-size:12px;color:#9fc7b5;letter-spacing:.12em;margin:12px 0 8px}
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  /* 单人练习开关：放在标题行右侧，不额外占高度 */
  .botchk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#ffe9a8;letter-spacing:0;
    background:rgba(240,200,90,.10);border:1px solid rgba(240,200,90,.32);padding:3px 9px;border-radius:999px;
    cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
  .botchk input{width:13px;height:13px;accent-color:#e9c46a;margin:0}
  .botchk.on{background:rgba(240,200,90,.28);border-color:rgba(240,200,90,.6)}
  .btnrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .modes{display:flex;flex-direction:column;gap:7px}
  .mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    padding:10px 14px;border-radius:14px;border:1px solid rgba(240,200,90,.22);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    color:#eaf3ee;box-shadow:0 4px 14px rgba(0,0,0,.28);transition:transform .1s,border-color .15s}
  .mode:active{transform:scale(.985)}
  .mode .mnum{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;color:#3a2a06;background:linear-gradient(160deg,#ffe8a3,#e9c46a);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
  .mode b{display:block;font-size:14.5px;font-weight:800}
  .mode em{display:block;font-style:normal;font-size:11px;color:#9fc7b5;margin-top:2px}
  .mode .mgo{margin-left:auto;font-size:12px;color:#f0c85a;border:1px solid rgba(240,200,90,.45);
    padding:3px 9px;border-radius:999px;flex:0 0 auto}

  .joinrow{display:flex;gap:8px;margin-top:14px;padding-top:2px}
  .inp{flex:1;min-width:0;background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.16);
    color:#eaf3ee;border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
  .inp::placeholder{color:#7fa696}
  .inp:focus{border-color:rgba(240,200,90,.6)}
  .inp.sm{padding:8px 10px;font-size:13px;border-radius:9px}

  /* ---------- 通用按钮 ---------- */
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;
    color:#0b2a1e;background:linear-gradient(180deg,#ffe8a3,#e9c46a);
    box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .1s,filter .15s;letter-spacing:.02em}
  .btn:active{transform:scale(.97)}
  .btn:disabled{filter:grayscale(.7) brightness(.72);box-shadow:none;cursor:not-allowed;transform:none}
  .btn.green{color:#06281a;background:linear-gradient(180deg,#8ef0b6,#33c47c);
    box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.55)}
  .btn.ghost{color:#dceee5;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
    box-shadow:none;font-weight:700}
  .btn.red{color:#fff;background:linear-gradient(180deg,#ef5a4d,#c02a1e);
    box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}

  /* ---------- 房间 ---------- */
  #room{position:absolute;inset:0;display:flex;flex-direction:column;z-index:5}

  .topbar{position:relative;z-index:20;display:flex;align-items:center;gap:6px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:linear-gradient(180deg,rgba(0,0,0,.42),transparent)}
  .topbar .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#d6ece2;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.13);
    padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill b{color:#ffe9a8;font-weight:800}
  .pill.gold{border-color:rgba(240,200,90,.45);color:#ffe9a8}
  .iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.34);color:#eaf3ee;font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .iconbtn:active{background:rgba(255,255,255,.14)}

  .table{position:relative;flex:1;min-height:0}
  #players{position:absolute;inset:0}

  /* 座位 */
  .seat{position:absolute;width:98px;display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:opacity .2s}
  .seat.left{left:2px;top:26%}
  .seat.right{right:2px;top:26%}
  .seat.top{left:50%;transform:translateX(-50%);top:0}
  .ava{position:relative;width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:17px;color:#fff;letter-spacing:.02em;
    background:linear-gradient(160deg,#4f8fd8,#20406e);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 5px 14px rgba(0,0,0,.45)}
  .seat.turn .ava{box-shadow:0 0 0 3px #f0c85a,0 0 20px 5px rgba(240,200,90,.55),inset 0 0 0 2px rgba(255,255,255,.3);
    animation:breath 1.4s ease-in-out infinite}
  @keyframes breath{0%,100%{box-shadow:0 0 0 3px #f0c85a,0 0 14px 2px rgba(240,200,90,.4),inset 0 0 0 2px rgba(255,255,255,.3)}
    50%{box-shadow:0 0 0 3px #ffe9a8,0 0 26px 8px rgba(240,200,90,.7),inset 0 0 0 2px rgba(255,255,255,.35)}}
  .seat .off .ava,.seat.offline .ava{filter:grayscale(.85) brightness(.7)}
  .rdy{position:absolute;right:-3px;bottom:-2px;width:17px;height:17px;border-radius:50%;
    background:#38d47f;border:2px solid #0a2b20;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#04240f}
  .rdy.no{background:#5f7285;color:#e3eef6;font-size:9px}
  .cdb{position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe8a3,#e9c46a);color:#3a2a06;
    font-weight:900;font-size:11px;padding:1px 7px;border-radius:9px;
    box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .sname{max-width:98px;font-size:12.5px;font-weight:800;color:#f2faf6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .smeta{font-size:10.5px;color:#a9d3c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:98px}

  .stack{position:relative;height:40px;width:66px;margin-top:1px}
  .stack .c{position:absolute;bottom:0;--w:26px}
  .cnt{position:absolute;right:-4px;bottom:-3px;min-width:22px;text-align:center;
    background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.26);
    border-radius:9px;font-size:10.5px;font-weight:800;color:#ffe9a8;padding:0 4px;line-height:15px}
  .tagsline{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .tg{font-size:9.5px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.4);
    color:#cfe8dc;border:1px solid rgba(255,255,255,.14);white-space:nowrap}
  .tg.gold{color:#3a2a06;background:linear-gradient(180deg,#ffe8a3,#e9c46a);border-color:transparent;font-weight:800}
  .tg.red{color:#fff;background:rgba(214,40,40,.85);border-color:transparent}
  .tg.cy{color:#062b26;background:#67e8f9;border-color:transparent;font-weight:800}
  .tg.owner{color:#fff;background:linear-gradient(180deg,#ff7a5c,#c02a1e);border-color:transparent;font-weight:900;
    box-shadow:0 0 8px rgba(255,90,60,.7)}
  .tg.off{color:#fff;background:rgba(185,42,30,.9);border-color:transparent;animation:bk 1.1s infinite}
  @keyframes bk{0%,100%{opacity:1}50%{opacity:.5}}
  .seat.owner .ava{box-shadow:0 0 0 3px #ff5a3c,0 0 18px 4px rgba(255,90,60,.55),inset 0 0 0 2px rgba(255,255,255,.3)}
  .pill.owner{color:#fff;background:linear-gradient(180deg,#ff7a5c,#c02a1e);border-color:transparent;font-weight:900}

  /* 快捷语音气泡：显示在发送人头像上方 */
  .bubble{position:absolute;bottom:100%;left:50%;margin-bottom:7px;
    width:max-content;max-width:170px;z-index:30;
    background:linear-gradient(180deg,#fffdf3,#f2e6c8);color:#3a2a06;
    font-size:11.5px;font-weight:800;line-height:1.35;padding:5px 9px;border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    animation:bubpop .22s cubic-bezier(.2,1.5,.4,1) forwards}
  .bubble:after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#f2e6c8}
  @keyframes bubpop{from{opacity:0;transform:translateX(-50%) translateY(9px) scale(.88)}
    to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  /* 上座在牌桌顶边，气泡改到座位下方避免出屏 */
  .seat.top .bubble{bottom:auto;top:100%;margin:7px 0 0}
  .seat.top .bubble:after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#f2e6c8}
  /* 左右座贴着屏幕边，气泡改为贴边展开（尖角仍对准头像中心），避免溢出屏幕 */
  .seat.left .bubble{left:0;transform:none;animation-name:bubpopme}

  /* 顶部提示条：原来也叫 .topbar，和房间顶栏撞名，把房间顶栏挤成了 fixed 定位，
     且提示条弹出时会整个盖住房间号/模式/菜单。这里独立成 .tipbar。 */
  .tipbar{position:fixed;left:0;right:0;top:0;z-index:60;
    padding:calc(8px + env(safe-area-inset-top)) 30px 8px 12px;
    font-size:12px;line-height:1.45;color:#fff;text-align:center;word-break:break-word;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tipbar.hide{display:none}
  #reconnBar{background:rgba(185,42,30,.94)}
  .tipbar.wxtip{background:rgba(18,28,58,.95);border-bottom:1px solid rgba(255,255,255,.14)}
  .tipbar.pwatip{background:rgba(16,52,40,.95)}
  .tipbar.updtip{background:rgba(18,74,52,.96);border-bottom:1px solid rgba(255,255,255,.14)}
  .updbtn{margin-left:8px;border:none;border-radius:8px;padding:2px 9px;font-size:11.5px;font-weight:800;
    color:#06281a;background:linear-gradient(180deg,#8ef0b6,#33c47c);cursor:pointer;font-family:inherit}
  .tipbar .x{position:absolute;right:8px;top:calc(5px + env(safe-area-inset-top));width:22px;height:22px;line-height:20px;
    background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
  /* 顶栏在流内占位；有提示条时把房间/大厅整体下移，顶栏不会被盖住（菜单按钮仍可点） */
  #app.tip-open #room,#app.tip-open #lobby{top:var(--tip-h,0px)}
  .seat.offline .ava{animation:pulseOff 1.1s ease-in-out infinite}
  @keyframes pulseOff{0%,100%{filter:grayscale(.85) brightness(.7)}50%{filter:grayscale(.6) brightness(.95)}}
  .seat.left .bubble:after{left:49px;transform:none}
  .seat.right .bubble{left:auto;right:0;transform:none;animation-name:bubpopme}
  .seat.right .bubble:after{left:auto;right:49px;transform:none}
  /* 自己的气泡：独立顶层定位（不被贴底弹层压住），位置由 JS 按头像算 */
  .bubble.fixed{position:fixed;bottom:auto;margin:0;transform:none;pointer-events:none;animation-name:bubpopme}
  .bubble.fixed:after{left:50%;transform:translateX(-50%)}
  .bubble-layer{position:fixed;left:0;top:0;width:0;height:0;z-index:9999;pointer-events:none}
  @keyframes bubpopme{from{opacity:0;transform:translateY(8px) scale(.88)}
    to{opacity:1;transform:translateY(0) scale(1)}}

  /* 快捷语音 侧边栏 */
  .sndbtn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;cursor:pointer;
    font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:0}
  .sndbtn.off{opacity:.55}
  /* 靠下一些：垂直居中会压住右侧座位的「电脑 / 叫过牌 / 本局主」标签 */
  .taunt-tab{position:fixed;right:0;top:64%;z-index:60;
    writing-mode:vertical-rl;cursor:pointer;user-select:none;-webkit-user-select:none;
    background:linear-gradient(180deg,#e9c46a,#b98a24);color:#3a2a08;
    font-size:12px;font-weight:800;letter-spacing:.16em;padding:14px 6px 12px;border-radius:10px 0 0 10px;
    box-shadow:0 4px 14px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);border-right:none}
  .taunt-tab .tdot{display:block;width:6px;height:6px;border-radius:50%;background:#3a2a08;margin-bottom:8px}
  /* 开局选择 / 叫牌时，底部浮条会顶到这个位置，把标签挪到桌面上方的空白区，避免抢按键点击 */
  #app.optbar-on .taunt-tab{top:30%}
  .taunt-panel{position:fixed;right:0;top:0;height:var(--vh100,100%);width:220px;max-width:74vw;z-index:61;
    background:rgba(16,22,36,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-left:1px solid rgba(255,255,255,.14);
    transform:translateX(100%);transition:transform .26s ease;
    display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
    box-sizing:border-box}
  .taunt-panel.open{transform:translateX(0)}
  .tp-head{display:flex;align-items:center;margin-bottom:8px}
  .tp-title{font-size:14px;font-weight:800;color:#ffe9a8}
  /* 关闭键：贴在面板左缘、垂直居中——避开 iOS 状态栏/刘海，任何屏高都点得到 */
  .tp-close{position:absolute;left:-34px;top:50%;transform:translateY(-50%);
    width:34px;height:52px;border-radius:12px 0 0 12px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    background:rgba(16,22,36,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);border-right:none;
    color:#ffe9a8;font-size:19px;font-weight:700;line-height:1;cursor:pointer;
    box-shadow:-4px 0 14px rgba(0,0,0,.42);
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .tp-close:active{background:rgba(240,200,90,.3)}
  .tp-close .txt{writing-mode:vertical-rl;font-size:11px;letter-spacing:.1em;margin-top:3px}
  .tp-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;padding:2px}
  .taunt-item{text-align:left;cursor:pointer;font-size:13px;font-weight:700;color:#f6ecd2;font-family:inherit;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    border-radius:10px;padding:9px 11px;transition:transform .12s,background .12s;line-height:1.3}
  .taunt-item:active{transform:scale(.97);background:rgba(240,200,90,.28)}
  .taunt-panel.cd .taunt-item{opacity:.45;pointer-events:none}
  .tp-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
  .tp-foot .lab{font-size:12px;color:#cdd6e0}

  /* 中央区域 */
  .center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:min(80%,400px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .waitbox{display:flex;flex-direction:column;align-items:center;gap:6px}
  .roomcode{font-size:40px;font-weight:900;letter-spacing:.16em;line-height:1;
    background:linear-gradient(180deg,#fff6d8,#e9c46a 60%,#b98a24);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .roomlabel{font-size:11px;letter-spacing:.3em;color:#a9d3c0}
  .rdyinfo{font-size:13px;color:#ffe9a8;font-weight:700}
  .modeswitch{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px}
  .ms-title{font-size:10.5px;letter-spacing:.14em;color:#8fb6a4}
  .ms-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .msbtn{flex:0 0 auto;padding:6px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);color:#dff3e8;font-size:12px;font-weight:700;cursor:pointer;transition:.12s}
  .msbtn:active{transform:scale(.96)}
  .msbtn.on{background:linear-gradient(160deg,#f0c85a,#e0a93c);color:#3a2a06;border-color:#f0c85a;box-shadow:0 0 12px rgba(240,200,90,.5)}
  .msbtn:disabled{opacity:.4;cursor:not-allowed}
  .playbox{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%}
  .lptitle{font-size:11px;letter-spacing:.2em;color:#a9d3c0}
  .lpcards{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:1px;min-height:54px}
  .lpcards .c{--w:38px}
  .lpowner{font-size:12px;color:#d6ece2}
  .notice{font-size:11.5px;color:#ffe9a8;background:rgba(0,0,0,.32);
    padding:4px 11px;border-radius:12px;max-width:100%;
    border:1px solid rgba(240,200,90,.18)}
  .notice.empty{display:none}
  .empty-hint{font-size:12.5px;color:#9fc7b5}

  /* 底部：自己 */
  .bottom{position:relative;z-index:15;padding:0 10px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.30) 30%,rgba(0,0,0,.55))}
  .mebar{display:flex;align-items:center;gap:8px;padding:4px 2px 2px;position:relative}
  .mebar .ava{width:36px;height:36px;font-size:13px}
  .mebar .mid{display:flex;flex-direction:column;min-width:0}
  .mebar .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mebar .sb{font-size:10.5px;color:#a9d3c0}
  .mebar .right{margin-left:auto;display:flex;align-items:center;gap:6px}

  .handrow{display:flex;justify-content:center;align-items:flex-end;min-height:70px;padding-top:16px}
  /* 手上没牌（等待阶段）时不占位，省下 86px 给牌桌，小屏安卓才不会被底栏挤掉 */
  .handrow.empty{min-height:0;padding-top:0}
  .hand{display:flex;justify-content:center;align-items:flex-end;max-width:100%;touch-action:none}
  .hand .c{cursor:pointer}
  .hand .c.sel{transform:translateY(-6px);box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 0 2px #f0c85a}
  .hand .c:active{filter:brightness(.96)}
  .hand .c.dim{filter:grayscale(.5) brightness(.72);opacity:.55}
  /* 滑动选牌进行中：给个轻微的金色描边提示范围 */
  .hand.dragging .c.range{box-shadow:0 0 0 2px #f0c85a, 0 3px 10px rgba(0,0,0,.4)}

  .acts{display:flex;justify-content:center;align-items:center;gap:9px;padding:8px 0 2px;min-height:44px}
  .acts .grow{flex:1}
  .acthint{font-size:12px;color:#cfe8dc}

  /* ---------- 安卓微调（html.android 由脚本判定，iOS 不受影响）----------
     安卓浏览器底部工具栏更吃空间，底栏整体收窄一点，把高度让给牌桌 */
  html.android .bottom{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  html.android .handrow{min-height:62px;padding-top:10px}
  html.android .acts{min-height:40px;padding:6px 0 0}
  html.android .mebar{padding:2px 2px 0}
  html.android .acts .btn{padding:11px 16px}

  /* 弹层 */
  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(2,12,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal.show{display:flex;animation:fadein .18s ease}
  /* 叫牌弹层：贴底、下缘透出，方便看自己的手牌；
     全屏遮罩层本身不拦截事件，只有 .box 面板接收点击，这样下方手牌可被点选 */
  .modal.bottom{align-items:flex-end;padding:14px 14px calc(206px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(2,12,8,.72) 0%,rgba(2,12,8,.55) 62%,rgba(2,12,8,.05) 100%);
    backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
  .modal.bottom .box{max-height:70vh;pointer-events:auto}
  /* 紧凑版弹层：选择阶段等，尽量少遮挡手牌 */
  .box.slim{max-width:380px;padding:12px 12px 14px}
  .box.slim .box-sub{margin-bottom:10px}
  .box.slim .choices{gap:7px}
  .box.slim .choice{padding:9px 6px;border-radius:12px}
  .box.slim .choice b{font-size:14.5px}
  .box.slim .choice em{font-size:10.5px;margin-top:2px}
  .box.slim .waitlist{margin-top:10px;gap:3px}
  /* 叫牌迷你版：单行选择 + 按钮，尽量矮 */
  .box.callslim{max-width:360px;padding:10px 12px 12px}
  .box.callslim .box-sub{margin:1px 0 9px;font-size:10.5px;line-height:1.45}
  .box.callslim .box-hd b{font-size:15.5px}
  .box.callslim .modal-acts{margin-top:9px;gap:8px}
  .box.callslim .modal-acts .btn{padding:10px 14px;font-size:14px}
  .box.callslim .errline{margin-top:7px}
  .givechip{margin-left:8px;font-size:10.5px;font-weight:700;color:#ffe9a8;
    background:rgba(240,200,90,.14);border:1px solid rgba(240,200,90,.4);
    padding:2px 8px;border-radius:9px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .callrow{display:flex;gap:8px}
  .callrow .sel{flex:1;min-width:0;padding:9px 10px;font-size:13.5px}

  /* ---------- 手牌上方紧凑浮条（开局选择 / 叫牌）----------
     小按键直接浮在手牌上方，不再用大弹层遮手牌 */
  .optbar{display:none;align-items:center;gap:6px;margin:6px 0 0;
    padding:7px 9px;border-radius:14px;
    background:linear-gradient(180deg,rgba(10,34,26,.94),rgba(6,22,17,.94));
    border:1px solid rgba(240,200,90,.30);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .optbar.show{display:flex;animation:fadein .16s ease}
  .optbar .cd{flex:0 0 auto;margin-left:0;font-size:13px;font-weight:900;color:#3a2a06;
    background:linear-gradient(180deg,#ffe8a3,#e9c46a);padding:2px 9px;border-radius:10px}
  .optbar .btn{flex:0 0 auto;padding:10px 13px;font-size:13.5px;border-radius:11px;white-space:nowrap}
  .optbar .btn.ghost{background:rgba(255,255,255,.08);color:#cfe8dc;border:1px solid rgba(255,255,255,.14)}
  /* 「正常开局 / 叫牌」主按键：更大更醒目，占满剩余宽度 */
  .optbar .btn.big{flex:1 1 auto;padding:12px 18px;font-size:15.5px;font-weight:900;
    background:linear-gradient(180deg,#3fe08a,#1fa85f);color:#04140c;
    box-shadow:0 4px 14px rgba(56,212,127,.35)}
  .optbar .btn.on{border-color:#f0c85a;background:rgba(240,200,90,.18);box-shadow:0 0 0 1px #f0c85a inset}
  .optbar .givechip{margin-left:0;max-width:110px;font-size:10px}
  .optbar .grow{flex:1}
  .obstat{flex:0 1 auto;min-width:0;font-size:10px;color:#9fc7b5;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  /* 叫牌展开行：点数（手机原生滚轮上下滑动选）+ 花色 + 确认 */
  .callpanel{display:none;gap:8px;align-items:center;margin:6px 0 0;
    padding:7px 9px;border-radius:14px;
    background:linear-gradient(180deg,rgba(10,34,26,.94),rgba(6,22,17,.94));
    border:1px solid rgba(240,200,90,.30);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .callpanel.show{display:flex;animation:fadein .16s ease}
  .callpanel select.sel{flex:1;min-width:0;width:auto;background:rgba(0,0,0,.32);color:#eaf3ee;
    border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:10px 10px;font-size:14px;
    outline:none;-webkit-appearance:none;appearance:none}
  .callpanel .btn{flex:0 0 auto;padding:11px 16px;font-size:14.5px;
    background:linear-gradient(180deg,#ffe8a3,#e9c46a);color:#3a2a06}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .box{width:100%;max-width:430px;max-height:88vh;overflow:auto;
    background:linear-gradient(180deg,#134436,#0a2a20);
    border:1px solid rgba(240,200,90,.30);border-radius:20px;padding:16px 16px 18px;
    box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.10);
    animation:pop .2s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .box-hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .box-hd b{font-size:17px;font-weight:900;letter-spacing:.04em}
  .box-hd .cd{margin-left:auto;font-size:14px;font-weight:900;color:#3a2a06;
    background:linear-gradient(180deg,#ffe8a3,#e9c46a);padding:1px 10px;border-radius:10px}
  .box-sub{margin:2px 0 14px;font-size:11.5px;color:#a9d3c0;line-height:1.5}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .choice{cursor:pointer;text-align:center;border-radius:14px;padding:14px 8px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#eaf3ee;
    transition:transform .1s,border-color .15s,background .15s}
  .choice:active{transform:scale(.97)}
  .choice b{display:block;font-size:16px;font-weight:900}
  .choice em{display:block;font-style:normal;font-size:11px;color:#9fc7b5;margin-top:4px}
  .choice[data-choice="discard"]{border-color:rgba(239,90,77,.5)}
  .choice[data-choice="discard"] b{color:#ff9c92}
  .choice.on{border-color:#f0c85a;background:rgba(240,200,90,.16);box-shadow:0 0 0 1px #f0c85a inset}
  .choice:disabled{opacity:.5;cursor:not-allowed}
  .waitlist{margin-top:14px;display:flex;flex-direction:column;gap:5px}
  .waitlist .wl{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfe8dc}
  .waitlist .wl i{width:6px;height:6px;border-radius:50%;background:#5f7285;flex:0 0 auto}
  .waitlist .wl.done i{background:#38d47f;box-shadow:0 0 6px #38d47f}
  .waitlist .wl em{margin-left:auto;font-style:normal;color:#ffe9a8;font-weight:700}

  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:#9fc7b5;letter-spacing:.1em;margin-bottom:5px}
  /* 下拉框统一样式（限定在 .modal 内，避免 .sel 误伤扑克牌的选中态 .c.sel） */
  .modal select.sel{width:100%;background:rgba(0,0,0,.32);color:#eaf3ee;border:1px solid rgba(255,255,255,.18);
    border-radius:11px;padding:11px 12px;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
  .modal select.sel:focus{border-color:rgba(240,200,90,.55)}
  .modal-acts{display:flex;gap:9px;margin-top:14px}
  .modal-acts .btn{flex:1}
  .callhist{margin-top:12px;font-size:11.5px;color:#bcdccd;line-height:1.7;max-height:88px;overflow:auto}
  .callhist b{color:#ffe9a8}
  .errline{margin-top:9px;font-size:12px;color:#ff9c92;background:rgba(192,42,30,.18);
    border:1px solid rgba(255,120,110,.35);border-radius:9px;padding:7px 10px}

  /* 结算 */
  .res-title{font-size:20px;font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff6d8,#e9c46a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .res-line{font-size:13px;color:#dceee5;line-height:1.9;display:flex;justify-content:space-between;gap:10px;
    border-bottom:1px dashed rgba(255,255,255,.10);padding:2px 0}

  /* 菜单 */
  .menu{position:absolute;right:10px;top:calc(46px + env(safe-area-inset-top));z-index:70;
    display:none;flex-direction:column;gap:2px;width:150px;padding:7px;border-radius:14px;
    background:rgba(9,32,24,.97);border:1px solid rgba(240,200,90,.28);
    box-shadow:0 16px 40px rgba(0,0,0,.6)}
  .menu.show{display:flex}
  .menu button{background:transparent;border:none;color:#e3f2ea;text-align:left;
    padding:10px 12px;font-size:13.5px;border-radius:9px;cursor:pointer}
  .menu button:active{background:rgba(255,255,255,.10)}
  .menu button.danger{color:#ff9c92}

  /* 积分榜 / 历史战绩 */
  #exportBox .box-hd b{flex:0 0 auto;white-space:nowrap}
  #exportBox .exp-meta{margin-left:auto;font-size:11.5px;color:#a9d3c0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .exp-rows{margin:2px 0 10px;border:1px solid rgba(255,255,255,.10);border-radius:12px;overflow:hidden}
  .exp-row{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(255,255,255,.04);
    border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
  .exp-row:last-child{border-bottom:none}
  .exp-row .rk{width:18px;font-weight:900;color:#e9c46a;font-size:13px}
  .exp-row .nm{flex:1;color:#eaf3ee;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp-row .nm .tag{font-style:normal;font-size:10px;font-weight:600;margin-left:5px;padding:1px 5px;border-radius:6px;
    background:rgba(255,255,255,.10);color:#a9d3c0}
  .exp-row .sc{font-weight:900;font-size:15px;color:#a9d3c0}
  .exp-row.up .sc{color:#ffe9a8}
  .exp-row.down .sc{color:#ff9c92}
  /* 「我」那一行：整行高亮 + 左侧金条，扫一眼就能找到自己 */
  .exp-row.me{background:rgba(240,200,90,.13);box-shadow:inset 3px 0 0 #f0c85a}
  .exp-row .nm .tag.me{background:rgba(240,200,90,.22);color:#ffe9a8;border-color:rgba(240,200,90,.5)}
  .exp-empty{padding:14px;text-align:center;font-size:12.5px;color:#8fb8a6}
  .exp-detail{border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:8px 11px;max-height:210px;overflow:auto}
  .exp-dtitle{font-size:11.5px;color:#a9d3c0;margin-bottom:6px;letter-spacing:.05em}
  .exp-g{padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.09)}
  .exp-g:last-child{border-bottom:none}
  .exp-g .gh{font-size:11.5px;color:#e9c46a;font-weight:700}
  .exp-g .gl{font-size:11.5px;color:#cfe4da;line-height:1.75;padding-left:8px}
  .hist-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
  .hist-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}
  .hist-item:active{background:rgba(255,255,255,.12)}
  .hist-item b{font-size:14px;letter-spacing:.08em}
  .hist-item span{flex:1;font-size:11px;color:#a9d3c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-item em{font-style:normal;font-size:11.5px;color:#e9c46a}
  /* 「我」在这次房间的成绩：名次 + 总分 */
  .hist-item .hr{font-style:normal;font-size:10.5px;color:#a9d3c0;background:rgba(255,255,255,.08);
    border-radius:7px;padding:1px 5px;flex:0 0 auto}
  .hist-item .hs{font-style:normal;font-size:13px;font-weight:900;color:#a9d3c0;min-width:34px;text-align:right;flex:0 0 auto}
  .hist-item .hs.up{color:#ffe9a8}
  .hist-item .hs.down{color:#ff9c92}
  .hist-sum{margin-top:-4px}
  .hist-sum b{color:#ffe9a8}

  .toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%) translateY(10px);
    background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;
    opacity:0;pointer-events:none;transition:.25s;z-index:200;border:1px solid rgba(255,255,255,.15)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:390px){
    .seat{width:86px}
    .ava{width:46px;height:46px;font-size:15px}
    .roomcode{font-size:34px}
    .logo h1{font-size:27px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 顶部提示条（重连 / 微信内打开 / 加到主屏） -->
  <div id="reconnBar" class="tipbar hide">网络断开，正在重连…<span id="reconnTry"></span></div>
  <div id="updBar" class="tipbar updtip hide">页面有新版本 <button id="btnUpd" class="updbtn">立即刷新</button></div>
  <div id="wxTip" class="tipbar wxtip hide"><span id="wxTipText"></span><button id="wxTipClose" class="x" aria-label="关闭">×</button></div>
  <div id="pwaTip" class="tipbar pwatip hide"><span id="pwaTipText"></span><button id="pwaTipClose" class="x" aria-label="关闭">×</button></div>

  <!-- ==================== 大厅 ==================== -->
  <section id="lobby">
    <div class="felt"></div>
    <div class="lobby-inner">
      <div class="topline">
        <span class="chip"><i class="dot" id="connDot"></i><span id="conn">连接中…</span></span>
        <span class="chip">ID <b id="myid">-</b></span>
      </div>

      <div class="logo">
        <div class="fan">
          <div class="c red"><span class="cc"><b>A</b><i>♥</i></span><span class="cs">♥</span></div>
          <div class="c"><span class="cc"><b>K</b><i>♠</i></span><span class="cs">♠</span></div>
          <div class="c joker red"><span class="jk">大王</span></div>
          <div class="c red"><span class="cc"><b>Q</b><i>♦</i></span><span class="cs">♦</span></div>
        </div>
        <h1>扑克联机</h1>
        <p>同桌 · 叫牌 · 换牌 · 计分</p>
      </div>

      <div class="sec-title sec-row">
        <span>选择模式开房</span>
        <label class="botchk" id="botChk"><input type="checkbox" id="chkBot" /><span>🤖 机器人陪打</span></label>
      </div>
      <div class="modes">
        <button class="mode" data-mode="1">
          <span class="mnum">3</span>
          <span class="m-main"><b>三人 · 带大小王</b><em>经典模式，双王在场，可出王炸</em></span>
          <span class="mgo">创建</span>
        </button>
        <button class="mode" data-mode="2">
          <span class="mnum">3</span>
          <span class="m-main"><b>三人 · 无王去黑桃3</b><em>移除大小王与黑桃3，牌力更紧凑</em></span>
          <span class="mgo">创建</span>
        </button>
        <button class="mode" data-mode="3">
          <span class="mnum">4</span>
          <span class="m-main"><b>四人 · 无大小王</b><em>四人同桌，手牌更少节奏更快</em></span>
          <span class="mgo">创建</span>
        </button>

<script>
// ===================== 常量 =====================
const RANK_VALUE = { BJ:100, SJ:99, '3':98, '8':97, '2':96, 'A':95, K:94, Q:93, J:92, '10':91, '9':90, '7':89, '6':88, '5':87, '4':86 };
const RESTRICTED = new Set(['BJ','SJ','3','8','2','A']);
const SUIT_NAME = { S:'黑桃', H:'红桃', C:'梅花', D:'方块' };
const SUIT_SYM  = { S:'♠', H:'♥', C:'♣', D:'♦' };
const SUIT_BY_NAME = { '黑桃':'S', '红桃':'H', '梅花':'C', '方块':'D' };
const ALLOWED_RANKS = ['4','5','6','7','9','10','J','Q','K'];
const SUITS = ['S','H','C','D'];
const COMBO_CN = { single:'单张', pair:'对子', bomb:'炸弹', straight:'顺子', pairstraight:'连对', wangzha:'王炸' };
const AVATAR = [
  ['#5b9bf0','#1f4c8f'], ['#f0a93f','#a35f10'], ['#4fd1a0','#0f6b4f'],
  ['#f0729c','#9c2049'], ['#a78bfa','#5b21b6'], ['#67e8f9','#0e6d7c']
];

// ===================== 视口高度修正（安卓底栏遮挡的根因）=====================
// 安卓浏览器（尤其工具栏在底部的）100vh / 100dvh 会高于真实可视区，
// 底部「我要准备 / 出牌」就被工具栏切掉。这里实测可视高度写进 --vh100。
(function initViewportHeight(){
  const root = document.documentElement;
  if(/Android/i.test(navigator.userAgent)) root.classList.add('android');
  let raf = 0;
  function apply(){
    raf = 0;
    const base = window.innerHeight || 0;
    const vv = window.visualViewport;
    let h = base;
    if(vv && vv.height){
      // 软键盘弹出时 visualViewport 会骤降到一半左右，此时不跟随，避免整页被压扁
      const keyboard = base && vv.height < base * 0.72;
      if(!keyboard) h = base ? Math.min(base, vv.height) : vv.height;
    }
    if(h > 0) root.style.setProperty('--vh100', Math.round(h) + 'px');
  }
  function schedule(){ if(raf) return; raf = requestAnimationFrame(apply); }
  apply();
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(schedule, 240));
  window.addEventListener('pageshow', schedule);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', schedule, { passive: true });
})();

// ===================== 顶部提示条占位 =====================
// 提示条是 fixed 的，弹出时会盖住房间顶栏（房间号/模式/⋯ 菜单）。
// 这里在它出现时把 #app 整体下移同样高度，顶栏始终可见可点。
(function initTipOffset(){
  const app = document.getElementById('app');
  if(!app) return;
  const bars = ['updBar','wxTip','pwaTip'].map(id => document.getElementById(id)).filter(Boolean);
  function sync(){
    let h = 0;
    bars.forEach(el => { if(!el.classList.contains('hide')) h = Math.max(h, el.offsetHeight); });
    app.style.setProperty('--tip-h', h + 'px');
    app.classList.toggle('tip-open', h > 0);
  }
  const mo = new MutationObserver(sync);
  bars.forEach(el => mo.observe(el, { attributes: true, attributeFilter: ['class'] }));
  sync();
  window.addEventListener('resize', sync, { passive: true });
})();

function cardLabel(c){
  if(c.rank==='BJ') return '大王';
  if(c.rank==='SJ') return '小王';
  return SUIT_NAME[c.suit]+c.rank;
}
function isRed(c){ return c.suit==='H' || c.suit==='D' || c.rank==='BJ'; }
function isJoker(c){ return c.rank==='BJ' || c.rank==='SJ'; }
function sortHand(hand){ return hand.slice().sort((a,b)=>(RANK_VALUE[b.rank]||0)-(RANK_VALUE[a.rank]||0)); }
function parseLabel(lbl){
  if(lbl==='大王') return { rank:'BJ', suit:'' };
  if(lbl==='小王') return { rank:'SJ', suit:'' };
  for(const k in SUIT_BY_NAME){ if(lbl.indexOf(k)===0) return { suit:SUIT_BY_NAME[k], rank:lbl.slice(k.length) }; }
  return { suit:'S', rank:lbl };
}
function hashIdx(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h % AVATAR.length; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===================== 牌面 HTML =====================
// w: 牌宽(px)，extraClass: 附加 class，extraStyle: 追加到 style 的样式
function faceHtml(card, w, extraClass, extraStyle){
  const cls = 'c' + (isRed(card)?' red':'') + (isJoker(card)?' joker':'') + (extraClass?(' '+extraClass):'');
  const st = '--w:'+w+'px' + (extraStyle ? (';'+extraStyle) : '');
  if(isJoker(card)){
    return '<div class="'+cls+'" data-id="'+(card.id||'')+'" style="'+st+'">'+
      '<span class="jk">'+(card.rank==='BJ'?'大王':'小王')+'</span></div>';
  }
  const sym = SUIT_SYM[card.suit] || '';
  return '<div class="'+cls+'" data-id="'+(card.id||'')+'" style="'+st+'">'+
    '<span class="cc"><b>'+esc(card.rank)+'</b><i>'+sym+'</i></span>'+
    '<span class="cs">'+sym+'</span></div>';
}
function backHtml(w){
  return '<div class="c back" style="--w:'+w+'px"></div>';
}

// ===================== 连接 =====================
function genId(){ return 'h5_'+Math.random().toString(36).slice(2,10); }
// 用 sessionStorage：同一浏览器多开标签页时每个标签是独立玩家，才能一台电脑模拟 3~4 人。
// 支持 ?cid=xxx 固定身份；受限 iframe 里 storage 会抛异常，降级到内存。
const store = (() => {
  try {
    const s = window.sessionStorage;
    s.setItem('__pk_t','1'); s.removeItem('__pk_t');
    return s;
  } catch(e){
    const mem = {};
    return { getItem:k=>(k in mem?mem[k]:null), setItem:(k,v)=>{mem[k]=String(v);}, removeItem:k=>{delete mem[k];} };
  }
})();
const urlCid = (()=>{ try{ return new URLSearchParams(location.search).get('cid'); }catch(e){ return null; } })();
let clientId = urlCid || store.getItem('pk_cid') || genId();
store.setItem('pk_cid', clientId);
let myName = store.getItem('pk_name') || ('玩家'+clientId.slice(3,6));
document.getElementById('name').value = myName;
let roomId = store.getItem('pk_room') || null;
let ws = null, lastState = null, selected = new Set(), callGiveId = null, cdTimer = null;
let handSelectable = false;   // 当前是否轮到自己出牌（可点选/滑动选）
let ackResultId = null;   // 已确认过的结算 id（本地兜底，保证一局只弹一次）

// 快捷语音（与服务端白名单一致，服务端会拒绝列表外的文案）
const TAUNTS = [
  '快点呀，我等的花儿都谢了',
  '怎么又断线了？',
  '不要走，决战到天亮',
  '你的牌打得也太好了',
  '和你合作真是太愉快了',
  '别走，我们再来一局',
  '你是MM还是GG？',
  '投降吧，你打不过我的'
];
const TAUNT_MS = 3600;   // 与服务端一致：气泡展示时长
const TAUNT_CD = 1500;   // 与服务端一致：发送冷却

document.getElementById('myid').textContent = clientId;

let WS_ENDPOINT = '';   // 由 ws.json / window.__WS_URL__ 注入，用于「页面放固定域名、后端在随时会变的隧道」的场景
function wsUrl(){
  // 1) 显式参数 ?ws= 优先（调试用）
  try { const q = new URLSearchParams(location.search).get('ws'); if(q) return q; } catch(e){}
  // 2) 运行时可配置（ws.json 或页面内联 __WS_URL__）
  if (WS_ENDPOINT) return WS_ENDPOINT;
  if (typeof window.__WS_URL__ === 'string' && window.__WS_URL__) return window.__WS_URL__;
  // 3) 兜底：同域名（页面由 cpolar 直接托管时的默认行为）
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  if (location.host) return proto + '//' + location.host;
  return 'ws://127.0.0.1:8443';
}
// 启动时拉取同目录 ws.json（固定托管时由部署脚本写入当前隧道地址），失败则用同域名兜底
async function loadWsConfig(){
  try {
    const r = await fetch('ws.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && typeof j.ws === 'string' && j.ws) {
      WS_ENDPOINT = j.ws;
      console.log('[ws] 使用 ws.json 指定后端:', j.ws);
    }
  } catch(e) { /* 没有 ws.json 就忽略，走同域名 */ }
}
function sendMsg(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }
function nameNow(){ const v=document.getElementById('name').value.trim(); myName=v||myName; store.setItem('pk_name',myName); return myName; }

// ==================== 版本自检 ====================
// 页面放在固定域名（GitHub Pages）后，桌面图标永远指向同一个地址：以后改代码只要重新发布，
// 图标照旧能用，点开就读到新版。但 GitHub Pages 的 HTML 有约 10 分钟 CDN 缓存，
// iOS 主屏 WebView 也可能拿旧缓存，所以这里对比 version.json，把「有新版本」显式提示出来。
const BUILD = '2026-11-03.16';   // 每次发布改这个值；tools/build-static.js 会据此生成 version.json
let updChecked = 0;
async function checkUpdate(force){
  const now = Date.now();
  if(!force && now - updChecked < 60000) return;   // 一分钟内不重复查
  updChecked = now;
  try{
    const r = await fetch('version.json?t=' + now, { cache:'no-store' });
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.build && j.build !== BUILD) showUpdateBar(j.build);
  }catch(e){}
}
function showUpdateBar(build){
  const bar = document.getElementById('updBar');
  if(!bar) return;
  if(!document.getElementById('reconnBar').classList.contains('hide')) return;  // 断线提示优先
  bar.innerHTML = '页面有新版本 <button id="btnUpd" class="updbtn">立即刷新</button>';
  bar.classList.remove('hide');
  const btn = document.getElementById('btnUpd');
  if(btn) btn.onclick = ()=>{
    // 带 ?v= 参数强制绕过 CDN / WebView 缓存
    location.replace(location.pathname + '?v=' + encodeURIComponent(build));
  };
}

function setConn(txt, state){
  const el=document.getElementById('conn');
  if(el) el.textContent = txt;
  const d=document.getElementById('connDot');
  if(d) d.className = 'dot' + (state==='ok'?' ok':state==='err'?' err':'');
}
let connRetry = 0;
let connStop = false;     // 房间已失效，停止重试
let connTimer = null;     // 待执行的重连定时器
let lastRecv = 0;         // 最后一次收到服务端消息的时间
let hbTimer = null;       // 心跳定时器
let probeTimer = null;    // 回前台探活超时定时器
let lastFgAt = 0;         // 前台事件节流
function backoff(){
  // 指数退避：1s → 1.8s → 3.2s → … 封顶 10s
  return Math.min(1000 * Math.pow(1.8, connRetry), 10000);
}
function showReconn(n, dead){
  const b=document.getElementById('reconnBar');
  if(!b) return;
  b.classList.remove('hide');
  if(dead){
    // 连多次仍失败：多半是 cpolar 免费域名重启后变了，旧图标/旧地址已失效
    b.innerHTML = '⚠️ 一直连不上，<b>域名可能已变更</b>。请重新扫码，或删除桌面图标后重新「添加到主屏幕」。';
  } else {
    b.innerHTML = '网络断开，正在重连…<span id="reconnTry">（第 '+n+' 次）</span>';
  }
}
function hideReconn(){ const b=document.getElementById('reconnBar'); if(b) b.classList.add('hide'); }
function scheduleReconnect(){
  if(connStop) return;
  if(connTimer) clearTimeout(connTimer);
  connTimer = setTimeout(()=>{ connTimer=null; connect(); }, backoff());
}
function connect(){
  if(connStop) return;
  if(connTimer){ clearTimeout(connTimer); connTimer=null; }
  const url = wsUrl();
  let sock;
  try { sock = new WebSocket(url); }
  catch(e){ setConn('地址无效','err'); showReconn(connRetry+1); scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = ()=>{
    if(ws !== sock) return;             // 已被新连接取代，忽略旧回调
    connRetry = 0;
    lastRecv = Date.now();
    setConn('已连接','ok');
    hideReconn();
    startHeartbeat();
    sendMsg({t:'hello', clientId, name:nameNow()});
  };
  sock.onclose = ()=>{
    if(ws !== sock) return;             // 旧连接的回调，忽略，避免重复重连
    stopHeartbeat();
    connRetry++;
    setConn('断开，重连中…','err');
    showReconn(connRetry, connRetry >= 4);
    scheduleReconnect();
  };
  sock.onerror = ()=>{ if(ws !== sock) return; setConn('连不上 '+url,'err'); };
  sock.onmessage = (ev)=>{
    if(ws !== sock) return;
    lastRecv = Date.now();
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    onMsg(m);
  };
}

// ==================== 心跳 / 假死检测 ====================
// iOS(和部分安卓)切后台后，WebSocket 会被系统静默掐断，但 readyState 仍显示 OPEN、
// onclose 也不触发 —— 这就是「切出去再回来，界面还在但完全不动」的原因。
// 解决：定时 ping 服务端，长时间收不到任何回包就判定假死，强制重连。
const HB_MS = 8000;       // 每 8 秒发一次 ping
const DEAD_MS = 18000;    // 超过 18 秒没收到任何消息（含 pong）判定假死

function startHeartbeat(){
  stopHeartbeat();
  lastRecv = Date.now();
  hbTimer = setInterval(()=>{
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    sendMsg({ t:'ping', ts: Date.now() });
    if(Date.now() - lastRecv > DEAD_MS) forceReconnect('心跳超时');
  }, HB_MS);
}
function stopHeartbeat(){
  if(hbTimer){ clearInterval(hbTimer); hbTimer=null; }
  if(probeTimer){ clearTimeout(probeTimer); probeTimer=null; }
}
function forceReconnect(reason){
  console.log('[ws] 强制重连:', reason);
  stopHeartbeat();
  const old = ws; ws = null;
  try { if(old) old.close(); } catch(e){}
  connRetry = 0;
  hideReconn();
  setConn('重连中…','err');
  connect();
}

// 回到前台：连接看着还开着也要先探活，2.5 秒收不到 pong 就强制重连
function onForeground(tag){
  const now = Date.now();
  if(now - lastFgAt < 800) return;      // 节流，避免 focus/visibility 连发
  lastFgAt = now;
  if(connStop) return;
  checkUpdate();                          // 回前台顺便看看有没有新版本
  if(!ws || ws.readyState !== WebSocket.OPEN){
    connRetry = 0; hideReconn(); connect(); return;
  }
  const t0 = now;
  sendMsg({ t:'ping', ts: t0 });
  if(probeTimer) clearTimeout(probeTimer);
  probeTimer = setTimeout(()=>{
    probeTimer = null;
    if(lastRecv < t0) forceReconnect('回前台探活超时(' + tag + ')');
  }, 2500);
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') onForeground('visibility'); });
window.addEventListener('pageshow', ()=>onForeground('pageshow'));   // iOS 从后台/缓存恢复（PWA 加主屏后主要靠这个）
window.addEventListener('focus', ()=>onForeground('focus'));
window.addEventListener('online', ()=>onForeground('online'));       // 网络恢复

function onMsg(m){
  if(m.t==='welcome'){
    if(m.reconnected && m.roomId){ roomId=m.roomId; store.setItem('pk_room',roomId); }
    else if(!m.reconnected && !m.roomId){
      // 服务器已无此房间（被解散或全员离线超时清理），而我们之前在房间里
      if(roomId){
        connStop = true;
        hideReconn();
        setConn('房间已失效','err');
        store.removeItem('pk_room'); roomId = null;
        toast('房间已失效，即将返回首页');
        setTimeout(()=>location.reload(), 2600);
      }
    }
  } else if(m.t==='created' || m.t==='joined'){
    roomId=m.roomId; store.setItem('pk_room',roomId);
    // 单人练习：座位已被机器人补满，替自己自动点一次准备，进房即开局
    if(m.t==='created' && m.bots && m.bots.length){
      setTimeout(()=>{ sendMsg({t:'ready', clientId, ready:true}); }, 350);
    }
  } else if(m.t==='state'){
    lastState=m; render();
  } else if(m.t==='speech'){
    speak(m.text);                      // 服务端播报：出牌 / 不要 / 不叫 / 叫牌 / 快捷语音
  } else if(m.t==='error'){
    toast('错误：'+m.msg);
  } else if(m.t==='dissolved'){
    roomId=null; store.removeItem('pk_room'); toast('房间已解散'); setTimeout(()=>location.reload(), 600);
  } else if(m.t==='scoresExport'){
    showExport(m.report);             // 积分榜：房主「导出积分榜」或「历史战绩」都会走到这里
  } else if(m.t==='scoresList'){
    histRows = m.rooms || [];         // 最近房间 + 「我」在每个房间的总分
    renderHist(false);
  } else if(m.t==='kicked'){
    roomId=null; store.removeItem('pk_room');
    toast(m.msg || '你已离开房间');
    setTimeout(()=>location.reload(), 900);
  }
}

// ---- 语音播报（浏览器 TTS，斗地主风格）----
let soundOn = true;
try { soundOn = localStorage.getItem('pk_sound') !== '0'; } catch(e){}
let zhVoice = null;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs = window.speechSynthesis.getVoices() || [];
  zhVoice = vs.find(v => /zh|cmn|Chinese/i.test((v.lang||'') + ' ' + (v.name||''))) || null;
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
// 预生成音频映射（服务端把每条语音先转成 mp3，手机/微信也能出声，不依赖浏览器 TTS）
let AUDIO_MAP = null;

// ---- 语音播报：Web Audio 预解码，出声零等待 ----
// 旧做法是「播报时才 new Audio().play()」：媒体元素即使命中缓存也要走媒体加载 + 解码，
// 手机/微信上常有 0.3~1s 的启动延迟，于是「牌先出、声音后到」。
// 现在改成一次性 fetch + decodeAudioData 解成 PCM 存内存，播报时直接 start()，
// 出声延迟≈0，完全不受网络影响（也不会跟人机延时混在一起）。
let AC = null;                          // AudioContext（iOS 需在用户手势内解锁）
let curSrc = null;                      // 正在播的那条（播完才轮下一条，不打断）
const AUDIO_BUF = {};                   // 文件名 -> AudioBuffer（解码后的 PCM）
const AUDIO_POOL = {};                  // 文件名 -> <audio>（仅在尚未解码完时兜底）
const decodeQueue = [];
let decodeInFlight = 0;
const DECODE_CONCURRENCY = 3;

// ---- 播报队列：一条念完再念下一条，绝不掐断 ----
// 早期是「新播报来了直接 stop() 上一条」：手速一快或机器人连着出，就只剩半句，
// 根本判断不出上家到底出了什么牌。现在改成排队 + 音轨本身念得更快：
// 既不丢信息，也不会越拖越远（正常出牌间隔 900ms，单条语音 0.4~0.7s）。
const SP_QUEUE = [];
const SP_MAX_QUEUE = 5;                 // 极端积压上限（连点快捷语音）：超了丢最老的一条
const SP_BUF_WAIT = 1500;               // 音轨还没解码好时最多等这么久，超时走媒体元素兜底
let spBusy = false;                     // 当前有一条在播（占着这个位置）
let spTimer = null;                     // onended 不触发时的保险定时器
let spStops = 0;                        // 打断次数（测试用，正常应恒为 0）

function audioCtx(){
  if(AC) return AC;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    AC = new Ctor();
  } catch(e){ AC = null; }
  return AC;
}

// 首次用户手势解锁：iOS/微信里 AudioContext 默认 suspended，必须手势内 resume 才能出声
function unlockAudio(){
  const ac = audioCtx();
  if(!ac) return;
  try {
    if(ac.state === 'suspended') ac.resume().catch(()=>{});
    const b = ac.createBuffer(1, 1, 22050);    // 1 帧静音，把自动播放锁顶开
    const s = ac.createBufferSource();
    s.buffer = b; s.connect(ac.destination); s.start(0);
  } catch(e){}
}

function pumpDecode(){
  if(!AUDIO_MAP) return;
  while(decodeInFlight < DECODE_CONCURRENCY && decodeQueue.length){
    const f = decodeQueue.shift();
    if(!f || AUDIO_BUF[f]) continue;
    const ac = audioCtx();
    if(!ac) return;
    decodeInFlight++;
    fetch('audio/' + f, { cache: 'force-cache' })
      .then(r => { if(!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(buf => new Promise((res, rej) => ac.decodeAudioData(buf, res, rej)))
      .then(ab => { if(ab) AUDIO_BUF[f] = trimSilence(ac, ab); })
      .catch(()=>{})
      .then(() => { decodeInFlight--; setTimeout(pumpDecode, 0); });   // 让出主线程，别卡界面
  }
}

// edge-tts 的每条音轨都是「150ms 头静音 + 语音 + 690ms 尾静音」。
// 以前不打断、直接顶掉的时候听不出来；改成排队后，这 0.85s 就变成每条之间干等一秒，
// 越排越慢。所以解码时把头尾静音裁掉（两端各留一点自然收尾，并做 4ms 淡入淡出防爆音）。
const SP_HEAD_PAD = 0.015, SP_TAIL_PAD = 0.05, SP_SILENCE = 0.008;
function trimSilence(ac, buf){
  try {
    const sr = buf.sampleRate, n = buf.length, ch = buf.numberOfChannels;
    const data = [];
    for(let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
    const loud = (i) => {
      for(let c = 0; c < ch; c++){ if(Math.abs(data[c][i]) > SP_SILENCE) return true; }
      return false;
    };
    let s = 0;
    while(s < n && !loud(s)) s++;
    if(s >= n) return buf;                       // 整条静音，原样返回
    let e = n - 1;
    while(e > s && !loud(e)) e--;
    const from = Math.max(0, s - Math.round(SP_HEAD_PAD * sr));
    const to = Math.min(n, e + Math.round(SP_TAIL_PAD * sr));
    const len = to - from;
    if(len <= 0 || len >= n * 0.98) return buf;  // 本来就没多少静音，别折腾
    const out = ac.createBuffer(ch, len, sr);
    const fade = Math.min(Math.round(0.004 * sr), Math.floor(len / 4));
    for(let c = 0; c < ch; c++){
      const dst = out.getChannelData(c);
      dst.set(data[c].subarray(from, to));
      for(let i = 0; i < fade; i++){ const g = i / fade; dst[i] *= g; dst[len - 1 - i] *= g; }
    }
    return out;
  } catch(e){ return buf; }
}

// 拿到清单后把全部语音排进解码队列（后台分批解，进房间几秒内就全在内存里了）
// 顺序有讲究：先解「不要/不叫」和单张牌名——这几条在开局头几秒就会被播到，
// 排在前面能保证刚坐下就零延迟；组合播报（对子/顺子/炸弹）后面慢慢补。
function speechPriority(t){
  if(t === '不要' || t === '不叫' || t === '过') return 0;
  if(t.length <= 2) return 1;                          // 单张牌：三 五 十 勾 圈 凯 尖 二 王
  if(t.indexOf('、') < 0 && t.length <= 4) return 2;    // 对五 / 三个七 / 王炸
  return 3;                                           // 顺子、连对、炸弹
}
function ensurePreload(){
  if(!AUDIO_MAP) return;
  const keys = Object.keys(AUDIO_MAP).sort((a, b) => speechPriority(a) - speechPriority(b));
  for(const t of keys){
    const f = AUDIO_MAP[t];
    if(!f || AUDIO_BUF[f] || decodeQueue.indexOf(f) >= 0) continue;
    decodeQueue.push(f);
  }
  pumpDecode();
}

function loadAudioMap(){
  try {
    // 带 BUILD 版本号：Pages CDN 会缓存 manifest.json 约 10 分钟，
    // 若拿到旧清单，新播报文案就查不到音轨（会退化到无声/TTS）。版本一变 URL 就变，必定取到新的
    fetch('audio/manifest.json?v=' + encodeURIComponent(BUILD), { cache: 'no-store' })
      .then(r=>r.json()).then(m=>{ AUDIO_MAP = m; ensurePreload(); }).catch(()=>{});
  } catch(e){}
}
function playAudio(text){
  if(!AUDIO_MAP) return false;
  const f = AUDIO_MAP[text];
  if(!f) return false;
  if(SP_QUEUE.length >= SP_MAX_QUEUE) SP_QUEUE.shift();   // 已经落后太多：丢最老的一条，新的牌面更重要
  SP_QUEUE.push({ f: f, text: text, at: Date.now() });
  pumpSpeech();
  return true;
}

// 队列推进：同一时刻只有一条在播，播完（或出错、或定时器兜底）才轮到下一条
function pumpSpeech(){
  if(spBusy) return;
  const job = SP_QUEUE.shift();
  if(!job) return;
  spBusy = true;

  const finish = ()=>{
    spBusy = false;
    curSrc = null;
    if(spTimer){ clearTimeout(spTimer); spTimer = null; }
    // 两条之间留一口气（60ms）：静音已裁掉，不给点间隙会糊成一片，反而听不清
    setTimeout(pumpSpeech, 60);
  };

  const ac = audioCtx();
  const buf = AUDIO_BUF[job.f];
  // 只有 AudioContext 真正处于 running 才走它：iOS 切后台会是 interrupted/suspended，
  // 这时 start() 只会排队不出声，宁可退回媒体元素，保证这条播报一定有声音。
  if(ac && buf && ac.state === 'running'){
    let done = false;
    const once = ()=>{ if(done) return; done = true; finish(); };
    try {
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(ac.destination);
      src.onended = once;
      curSrc = src;
      src.start(0);                      // 数据全在内存，立即出声
      // onended 在个别机型上会丢（切后台再回来），加个按音轨长度的保险，别让队列卡死
      spTimer = setTimeout(once, Math.ceil(buf.duration * 1000) + 200);
      return;
    } catch(e){ once(); return; }
  }

  // 音轨还没解码好（刚进房间那一两秒）：插队解码，原地等它一会儿
  if(ac && ac.state !== 'running'){ try { ac.resume().catch(()=>{}); } catch(e){} }
  if(!AUDIO_BUF[job.f] && decodeQueue.indexOf(job.f) < 0){ decodeQueue.unshift(job.f); pumpDecode(); }
  const deadline = Date.now() + SP_BUF_WAIT;
  const retry = ()=>{
    const ac2 = audioCtx();
    const b2 = AUDIO_BUF[job.f];
    if(ac2 && b2 && ac2.state === 'running'){
      spBusy = false;                     // 解好了，按原顺序重新入队
      SP_QUEUE.unshift(job);
      pumpSpeech();
      return;
    }
    if(Date.now() > deadline){
      // 等不到就退货给媒体元素；它自己 onended 之后再把队列交还
      playAudioFallback(job.f, ()=>{ spBusy = false; setTimeout(pumpSpeech, 0); });
      return;
    }
    spTimer = setTimeout(retry, 60);
  };
  spTimer = setTimeout(retry, 60);
}

// 媒体元素兜底：慢、但一定能出声。onDone 保证它播完才让队列往下走，避免两条声音叠在一起
function playAudioFallback(f, onDone){
  let called = false;
  const done = ()=>{ if(called) return; called = true; if(onDone) onDone(); };
  try {
    let src = AUDIO_POOL[f];
    if(!src){ src = new Audio('audio/' + f); src.preload = 'auto'; AUDIO_POOL[f] = src; }
    const a = src.cloneNode(true);
    a.onended = done;
    a.onerror = done;
    a.play().catch(done);
    if(onDone) setTimeout(done, 5000);
    return true;
  } catch(e){ done(); return false; }
}
let audioMapTried = 0;
function speak(text){
  if(!soundOn || !text) return;
  // 清单没拉到（首次网络抖动）就顺手重试一次，否则只能退化到系统 TTS
  if(!AUDIO_MAP && Date.now() - audioMapTried > 4000){ audioMapTried = Date.now(); loadAudioMap(); }
  if(playAudio(text)) return;             // 优先用预解码音频（手机/微信可用，出声零等待）
  // 兜底：浏览器自带 TTS（桌面端多半可用）
  if(!('speechSynthesis' in window)) return;
  try {
    const ss = window.speechSynthesis;
    if(ss.paused) ss.resume();
    const vs = ss.getVoices() || [];
    if(!zhVoice && vs.length) zhVoice = vs.find(v => /zh|cmn|Chinese/i.test((v.lang||'')+' '+(v.name||''))) || null;
    // 这里也不再 cancel：系统 TTS 自己就是队列广播，掐断同样会「只听得到半句」
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.25; u.pitch = 1.02; u.volume = 1;
    if(zhVoice) u.voice = zhVoice;
    ss.speak(u);
  } catch(e){}
}
// 首次用户手势解锁：Web Audio（手机主路径）+ Web Speech（桌面兜底）
function unlockSpeech(){
  unlockAudio();
  if(!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
    setTimeout(()=>{ try{ window.speechSynthesis.cancel(); }catch(e){} }, 60);
  } catch(e){}
}
document.addEventListener('pointerdown', unlockSpeech, { once:true });
document.addEventListener('touchend', unlockSpeech, { once:true });
// 部分机型首帧 resume 会失败，之后每次点击都顺手恢复一下（无副作用、开销极低）
document.addEventListener('pointerdown', ()=>{
  const ac = audioCtx();
  if(ac && ac.state === 'suspended') ac.resume().catch(()=>{});
}, { passive: true });
function updateSoundBtn(){
  const b = document.getElementById('btnSound');

}
// 关掉语音 / 退出房间：把没念完的清掉，别让关了声还继续播
function clearSpeechQueue(){
  SP_QUEUE.length = 0;
  if(spTimer){ clearTimeout(spTimer); spTimer = null; }
  if(curSrc){ try{ curSrc.stop(0); spStops++; }catch(e){} curSrc = null; }
  spBusy = false;
  try { if('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e){}
}

function bubbleHtml(t, cls){
  if(!t || !t.text) return '';
  return '<div class="bubble'+(cls?(' '+cls):'')+'" data-until="'+((t.ts||0)+TAUNT_MS)+'">'+esc(t.text)+'</div>';

// 自己的气泡挂在顶层图层，位置按底栏头像实时算（不会被贴底弹层盖住）
function placeMeBubble(t){
  const layer = document.getElementById('meBubble');
  if(!layer) return;
  const txt = (t && t.text) || '';
  // 选择/叫牌/结算弹层占满底部时，自己的头像行在弹层下面，气泡会盖住弹层内容 → 暂不显示
  const covered = !!document.querySelector('.modal.show');
  if(!txt || covered){ if(layer.innerHTML) layer.innerHTML = ''; layer.dataset.txt = ''; return; }
  if(layer.dataset.txt === txt && layer.dataset.ts === String(t.ts)) return; // 同一句不重播动画
  layer.dataset.txt = txt; layer.dataset.ts = String(t.ts);
  layer.innerHTML = bubbleHtml(t, 'fixed');
  const ava = document.getElementById('meAva').getBoundingClientRect();
  const el = layer.querySelector('.bubble');
  if(!el) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(4, Math.min(window.innerWidth - w - 4, ava.left + ava.width / 2 - w / 2));
  el.style.left = left + 'px';
  el.style.top = Math.max(4, ava.top - h - 9) + 'px';
}
// 气泡到点自动消失（服务端到期后不再下发，这里负责本地收尾）
function scheduleBubbles(){
  document.querySelectorAll('.bubble[data-until]').forEach(el=>{
    if(el.dataset.sched) return;
    el.dataset.sched = '1';
    const left = (+el.dataset.until) - Date.now();
    setTimeout(()=>{ el.remove(); }, Math.max(60, left));
  });
}

function renderBotBtns(s, meP){
  const add = document.getElementById('btnAddBot');
  const del = document.getElementById('btnDelBot');
  if(!add || !del) return;
  const canEdit = s.phase === 'waiting' && !!(meP && meP.isHost);
  const botCnt = s.players.filter(p => p.isBot).length;
  const full = s.players.length >= s.requiredPlayers;
  add.style.display = canEdit ? 'inline-block' : 'none';
  del.style.display = canEdit ? 'inline-block' : 'none';
  add.disabled = full;
  del.disabled = botCnt === 0;
  add.textContent = full ? '座位已满' : '＋ 机器人';
  del.textContent = botCnt ? ('－ 机器人 ' + botCnt) : '－ 机器人';
}

// ---- 座位 ----
function renderSeats(s, me){
  const box = document.getElementById('players');
  const others = s.players.filter(p => p.clientId !== me);
  const posList = others.length <= 1 ? ['right']
                : others.length === 2 ? ['left','right']
                : ['left','top','right'];

  box.innerHTML = others.map((p,i)=>{
    const pos = posList[i] || 'left';
    const isTurn = p.clientId === s.currentTurnClientId;
    const score = (s.scores && s.scores[p.clientId]!==undefined) ? s.scores[p.clientId] : 0;
    const col = AVATAR[hashIdx(p.name||p.clientId)];
    const initial = p.isBot ? '机' : ((p.name||'').replace(/^玩家/,'').slice(0,2) || '?');

    const tags = [];
    if(p.isBot) tags.push('<span class="tg">电脑</span>');
    if(p.isHost) tags.push('<span class="tg gold">房主</span>');
    if(!p.connected) tags.push('<span class="tg off">掉线</span>');
    if(p.isRevealed) tags.push('<span class="tg cy">明牌</span>');
    if(p.isCaller) tags.push('<span class="tg red">叫过牌</span>');
    const isOwner = s.ownerClientId === p.clientId && (s.phase==='playing' || s.phase==='calling');
    if(isOwner) tags.push('<span class="tg owner">★ 本局主</span>');

    // 手牌展示：明牌/公开时显示小牌面（拉开间距、按座位方向展开避免出屏），否则显示牌背堆
    let cardsHtml = '';
    if(p.hand && p.hand.length){
      const sorted = sortHand(p.hand);
      const show = sorted.slice(0, 8);
      const step = 16;                       // 每张露出 16px
      const wpx = 26 + step * (show.length - 1);
      // 左座从左侧向桌内展开、右座从右侧向桌内展开、上座居中
      const align = pos === 'left' ? 'align-self:flex-start;' : pos === 'right' ? 'align-self:flex-end;' : 'align-self:center;';
      cardsHtml = '<div style="'+align+'position:relative;width:'+wpx+'px;height:40px">' +
        show.map((c,idx)=>
          faceHtml(c, 26, '', 'position:absolute;left:'+(idx*step)+'px;bottom:0;z-index:'+(idx+1))
        ).join('') +
        (sorted.length > show.length ? '<div class="cnt" style="right:-8px">+'+(sorted.length-show.length)+'</div>' : '') +
        '</div>';
    } else if(p.handCount > 0){
      const n = Math.min(4, p.handCount);
      let backs = '';
      for(let k=0;k<n;k++){
        backs += '<div class="c back" style="--w:26px;position:absolute;left:'+(k*9)+'px;bottom:0;z-index:'+(k+1)+';transform:rotate('+((k-(n-1)/2)*4)+'deg)"></div>';
      }
      cardsHtml = '<div class="stack">'+backs+'<div class="cnt">×'+p.handCount+'</div></div>';
    }

    return '<div class="seat '+pos+(isTurn?' turn':'')+(isOwner?' owner':'')+(p.connected?'':' offline')+'">'+
      bubbleHtml(p.taunt)+
      '<div class="ava" style="background:linear-gradient(160deg,'+col[0]+','+col[1]+')">'+
        esc(initial)+
        (p.ready ? '<div class="rdy">✓</div>' : '<div class="rdy no">·</div>')+
        (isTurn ? '<div class="cdb" id="turnCd">30</div>' : '')+
      '</div>'+
      '<div class="sname">'+esc(p.name)+'</div>'+
      '<div class="smeta">'+(p.roundNumber?('玩家'+p.roundNumber+' · '):'')+'分 '+score+' · 牌 '+(p.handCount||0)+'</div>'+
      cardsHtml+
      (tags.length ? '<div class="tagsline">'+tags.join('')+'</div>' : '')+
    '</div>';
  }).join('');
}

// ---- 中央 ----
function renderCenter(s, me, meP){
  const wait = s.phase === 'waiting';
  document.getElementById('waitBox').classList.toggle('hidden', !wait);
  document.getElementById('playBox2').classList.toggle('hidden', wait);

  // 准备进度
  if(wait){
    const readyCnt = s.players.filter(p=>p.ready).length;
    const lackP = s.requiredPlayers - s.players.length;
    const lackR = s.requiredPlayers - readyCnt;
    let txt = '已准备 '+readyCnt+'/'+s.requiredPlayers;
    if(lackP > 0) txt += ' · 还差 '+lackP+' 人加入';
    else if(lackR > 0) txt += ' · 还差 '+lackR+' 人准备' + (meP && !meP.ready ? '（含你）' : '');
    else txt += ' · 即将开局';
    const ri = document.getElementById('readyInfo');
    ri.textContent = txt;
    ri.style.color = (lackP===0 && lackR===0) ? '#7ef0ad' : '#ffe9a8';

    // 房主模式切换条（仅未开局且我是房主时显示）
    renderModeSwitch(s, meP);
  }

  // 桌面出牌
  const lp = s.lastPlay;
  const cardsEl = document.getElementById('lastPlay');
  const ownerEl = document.getElementById('lastPlayOwner');
  if(!lp || !lp.cards || !lp.cards.length){
    cardsEl.innerHTML = '<span class="empty-hint">'+(s.phase==='playing'?'等待领出':'等待发牌')+'</span>';
    ownerEl.textContent = '';
  } else {
    cardsEl.innerHTML = lp.cards.map(lbl => faceHtml(parseLabel(lbl), 38)).join('');
    const who = s.players.find(p=>p.clientId===lp.clientId);
    const combo = lp.combo ? (COMBO_CN[lp.combo.type]||'') : '';
    ownerEl.innerHTML = (who?esc(who.name):'') + (combo?(' · '+combo):'') +
      (s.base?(' · 基数 '+s.base):'');

}

  [...selected].forEach(id=>{ if(!ids.has(id)) selected.delete(id); });
  const mode = s.phase === 'playing'
    ? (myTurn ? 'play' : 'wait')
    : (s.phase === 'calling' && myTurn ? 'call' : 'wait');

    btnPass.disabled = !myTurn || !s.lastPlay;

    hint.textContent = myTurn ? (selected.size ? '已选 '+selected.size+' 张' : '点牌选中，再点「出牌」')
                              : (turnP?('等待 '+turnP.name+' 出牌'):'');
  }
}

// ---- 手牌（自动计算重叠）----
// mode: 'play' 出牌可选 | 'call' 叫牌可选(点牌=给出) | 'wait' 只读
function renderHand(hand, mode){
  const box = document.getElementById('myHand');
  handSelectable = (mode === 'play');   // 仅轮到自己出牌时可点选/滑动选
  const n = hand.length;
  // 没牌时整行收起来（等待阶段），不白占 86px
  if(box.parentElement) box.parentElement.classList.toggle('empty', !n);
  if(!n){ box.innerHTML = ''; return; }
  const sorted = sortHand(hand);
  const vw = Math.min(window.innerWidth, 720);
  const cw = vw <= 380 ? 44 : vw <= 430 ? 48 : vw <= 560 ? 54 : 60;
  const avail = Math.min(vw, 720) - 24;
  const step = n > 1 ? Math.max(15, Math.min(cw * 0.80, (avail - cw) / (n - 1))) : cw;
  const over = cw - step;

  box.innerHTML = sorted.map((c,i)=>{
    const sel = selected.has(c.id) ? ' sel' : '';
    const disabled = (mode==='call') && RESTRICTED.has(c.rank) ? ' dim' : '';
    return '<div class="c'+(isRed(c)?' red':'')+(isJoker(c)?' joker':'')+sel+disabled+
      '" data-id="'+c.id+'" data-idx="'+i+'" style="--w:'+cw+'px;margin-left:'+(i===0?0:-over)+'px;z-index:'+(i+1)+'">'+
      (isJoker(c)
        ? '<span class="jk">'+(c.rank==='BJ'?'大王':'小王')+'</span>'
        : '<span class="cc"><b>'+esc(c.rank)+'</b><i>'+(SUIT_SYM[c.suit]||'')+'</i></span>'+
          '<span class="cs">'+(SUIT_SYM[c.suit]||'')+'</span>')+
      '</div>';
  }).join('');

  box.querySelectorAll('.c').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      if(mode === 'call'){
        const card = hand.find(c=>c.id===id);
        if(!card) return;
        if(RESTRICTED.has(card.rank)){ toast('王 / 3 / 8 / 2 / A 不可给出'); return; }
        // 再次点击已选中的牌 → 取消选择（不必先点另一张才能取消）
        if(callGiveId === id){ callGiveId = null; syncCallGive(null); }
        else { callGiveId = id; syncCallGive(id); }
        return;
      }
      if(mode !== 'play'){ return; }
      togglePlayCard(id);
    };
  });
}

// 出牌阶段的「选中 / 取消选中」。抽成函数是为了让 pointerup 也能直接调用：
// 手指轻点时如果抖到相邻的牌上，浏览器根本不会给任何一张牌发 click，
// 只靠 onclick 就等于「点了没反应、取消不掉」。
function togglePlayCard(id){
  if(!id) return;
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  const el = document.querySelector('#myHand .c[data-id="'+id+'"]');
  if(el) el.classList.toggle('sel', selected.has(id));
  const hint = document.getElementById('actHint');
  if(hint) hint.textContent = selected.size ? ('已选 '+selected.size+' 张') : '点牌选中，再点「出牌」';
}

// ---- 滑动选牌（出顺子 / 连对 / 炸弹更顺手，不再只能逐张点）----
// 在牌上按住并横向划过：从起点到当前点（按排序位置）之间的所有牌一次性选中；
// 轻点单张仍走上面的 onclick 逐张切换。两者不冲突。
let handDrag = null;       // { id, startIdx, x, y, moved }
// 本次手势的 click 是否已由 pointerup 代为处理。
// 不能用 setTimeout(0) 复位：真机上 pointerup 与 click 不在同一个任务里，
// 定时器常常先跑，click 就会再 toggle 一次、把刚选的又取消掉 —— 表现就是「单击没反应、只能滑动」。
// 改成 pointerdown 复位 / pointerup 置位 / 捕获到 click 时吞一次，完全不依赖时序。
let tapHandled = false;     // 本次手势的 click 已由 pointerup 处理
let tapHandledAt = 0;       // 处理时刻（超时兜底，避免标记残留到下一次无关的点击）
function initHandDrag(){
  const box = document.getElementById('myHand');
  if(!box || box.dataset.dragBound) return;
  box.dataset.dragBound = '1';

  const idxAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const c = el && el.closest ? el.closest('.c') : null;
    if(!c || !box.contains(c)) return -1;
    return +c.dataset.idx;
  };
  const applyRange = (lo, hi) => {
    selected.clear();
    box.querySelectorAll('.c').forEach(el=>{
      const i = +el.dataset.idx;
      const on = i >= lo && i <= hi;
      if(on) selected.add(el.dataset.id);
      el.classList.toggle('sel', on);
      el.classList.toggle('range', on);
    });
    const hint = document.getElementById('actHint');
    if(hint) hint.textContent = '已选 ' + selected.size + ' 张（滑动选）';
  };

  box.addEventListener('pointerdown', (e)=>{
    tapHandled = false;                         // 新手势一律复位（叫牌/等待阶段也复位）
    if(!handSelectable) return;                 // 不是自己出牌时，交给原 onclick
    const card = e.target.closest('.c');
    if(!card || !box.contains(card)) return;
    // 选中/取消由 pointerup 统一处理，这里从源头抑制浏览器再合成一次 click；
    // 否则 pointerup + click 各切一次，正好互相抵消。
    if(e.cancelable) e.preventDefault();
    handDrag = { id: card.dataset.id, startIdx: +card.dataset.idx, x: e.clientX, y: e.clientY, moved: false };
  });
  // 移动 / 抬起挂在 window 上：手指划出牌区也能继续跟踪，且不去抢占指针（避免吞掉随后的 click）
  const onMove = (e)=>{
    if(!handDrag) return;
    const cur = idxAt(e.clientX, e.clientY);
    if(!handDrag.moved){
      const dx = Math.abs(e.clientX - handDrag.x), dy = Math.abs(e.clientY - handDrag.y);
      // 只按位移判定是否算「滑动」：手指轻点时抖 1~3px、或指尖刚好压到相邻牌的边上，
      // 以前会被当成滑动而把刚点的那张重新选中，看起来就是「再点一下取消不掉」。
      if(dx > 12 || dy > 12) handDrag.moved = true;
      else return;
    }
    if(cur < 0) return;                         // 拖出牌区：保持上次范围
    const lo = Math.min(handDrag.startIdx, cur), hi = Math.max(handDrag.startIdx, cur);
    box.classList.add('dragging');
    applyRange(lo, hi);
  };
  const end = (e) => {
    if(!handDrag) return;
    const wasMoved = handDrag.moved;
    const downId = handDrag.id;
    handDrag = null;
    box.classList.remove('dragging');
    // 不管轻点还是滑动，这次手势的后续 click 一律由我们自己吞掉：
    // 轻点已在下面 toggle 过；滑动已用 applyRange 选好范围，再来一次单张反选就白选了。
    tapHandled = true;
    tapHandledAt = Date.now();
    if(wasMoved) return;
    // 轻点：这里自己处理，不再等 click。
    // 手指抖动让 release 落到相邻那张牌上时，浏览器不会给任何一张牌发 click
    // （click 只发给按下/抬起的共同祖先），只靠 onclick 就成了「点了没反应、取消不掉」。
    togglePlayCard(downId);
  };
  const cancel = () => { if(handDrag){ handDrag = null; box.classList.remove('dragging'); } };
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', cancel);
  box.addEventListener('click', (e)=>{
    const fresh = tapHandled && (Date.now() - tapHandledAt) < 1000;   // 只吞「紧接着这次手势」的 click
    tapHandled = false;
    if(fresh){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}

function syncCallGive(id){
  const label = document.getElementById('callGiveLabel');
  document.querySelectorAll('#myHand .c').forEach(el=>{
    el.classList.toggle('sel', el.dataset.id === id);
  });
  if(label){
    const mine = (lastState.players.find(p=>p.clientId===lastState.you)||{}).hand || [];
    const card = mine.find(c=>c.id===id);
    label.textContent = card ? ('给出：'+cardLabel(card)) : '未选给出牌';
  }
}

// ---- 手牌上方浮条（开局选择 / 叫牌）----
function renderModals(s, me, meP){
  // 开局选择：四个小按键，超时默认正常开局
  const selecting = s.phase === 'selecting';
  toggle('selectBox', selecting);
  if(selecting){
    const chosen = meP && meP.choice;
    document.querySelectorAll('#selectBox .btn[data-choice]').forEach(b=>{
      b.disabled = !!chosen;
      b.classList.toggle('on', !!chosen && chosen === b.dataset.choice);
    });
    const st = document.getElementById('choiceList');
    if(st){
      const done = s.players.filter(p=>p.choice).length;
      st.textContent = chosen && done < s.players.length
        ? (done + '/' + s.players.length + ' 已选') : '';
    }
  }

  // 叫牌：紧凑浮条；点「叫牌」后展开点数/花色
  const myCall = s.phase === 'calling' && s.currentTurnClientId === me;
  toggle('callBox', myCall);
  if(!myCall) toggle('callPanel', false);
  if(myCall){
    fillCallSelects(s, me, meP);
  }

  // 选择/叫牌期间底栏操作行是空的，收起来给牌桌腾地方
  const actsRow = document.querySelector('.bottom .acts');
  if(actsRow) actsRow.classList.toggle('hidden', selecting || myCall);
  // 浮条出现时把右侧「快捷语音」标签上移，别盖住浮条右端的按键
  const appEl = document.getElementById('app');
  if(appEl) appEl.classList.toggle('optbar-on', selecting || myCall);

  // 结算（已确认过的 id 不再弹）
  const pending = (s.pendingResult && s.pendingResult.id !== ackResultId) ? s.pendingResult : null;
  toggle('resultBox', !!pending);
  if(pending){
    document.getElementById('resTitle').textContent = pending.title || '本局结算';
    document.getElementById('resLines').innerHTML = (pending.lines||[])
      .map(l=>'<div class="res-line"><span>'+esc(l)+'</span></div>').join('');
  }
}

// 叫牌可以「叫」哪些牌：可交换点数的 9 个 × 4 花色，再去掉
// ① 自己手上已有的（叫自己的牌等于白换，之前要等服务端报错才知道）
// ② 前面的玩家已经叫过的（服务端 requestedSet，牌面上已换手）
function callTargets(s, meP){
  const mine = new Set(((meP && meP.hand) || []).map(c => c.suit + '|' + c.rank));
  const asked = new Set((s && s.requested) || []);
  const out = [];
  ALLOWED_RANKS.forEach(r=>{
    SUITS.forEach(su=>{
      const key = su + '|' + r;
      if(mine.has(key) || asked.has(key)) return;
      out.push({ key, label: SUIT_SYM[su] + ' ' + r });
    });
  });
  return out;
}

function fillCallSelects(s, me, meP){
  // 给出的牌：由单击手牌选择，这里只负责在换手后清掉失效的选择
  const mine = meP && meP.hand ? meP.hand : [];
  if(callGiveId && !mine.some(c=>c.id===callGiveId)){ callGiveId = null; }
  syncCallGive(callGiveId);

  // 目标牌：单个下拉，只列合法目标（不用再「点数 + 花色」两次选，也就不会选到自己手上的牌）
  const sel = document.getElementById('callTarget');
  const list = callTargets(s, meP);
  const keep = sel.value;
  sel.innerHTML = list.length
    ? list.map(t=>'<option value="'+t.key+'">'+t.label+'</option>').join('')
    : '<option value="">没有可叫的牌</option>';
  if(keep && list.some(t=>t.key===keep)) sel.value = keep;
  sel.disabled = !list.length;

  const btn = document.getElementById('btnCall');
  if(btn) btn.disabled = !list.length;

  const first = meP && meP.roundNumber === 1;
  const skip = document.getElementById('btnSkipCall');
  // 必须叫牌却又没有合法目标牌（极少数）：兜底露出「不叫牌」，别把人卡死
  skip.style.display = (first && list.length) ? 'none' : 'block';
  skip.textContent = '不叫牌';
}

// ---- 倒计时 ----
function startCountdown(s){
  if(cdTimer) clearInterval(cdTimer);
  const dl = s.phase==='selecting' ? s.selectDeadline
           : s.phase==='calling' ? s.callDeadline
           : s.phase==='playing' ? s.playDeadline : 0;
  const pill = document.getElementById('cdPill');
  const isSelecting = s.phase === 'selecting';
  const isCalling = s.phase === 'calling';
  // 选择/叫牌阶段：顶部 pill 隐藏（弹层内有倒计时）；出牌阶段：顶部显示
  pill.style.display = (dl && !isSelecting && !isCalling) ? 'inline-flex' : 'none';
  const tick = ()=>{
    const r = dl ? Math.max(0, Math.ceil((dl - Date.now())/1000)) : 0;
    const el = document.getElementById('countdown'); if(el) el.textContent = r + 's';
    const sc = document.getElementById('selCount'); if(sc) sc.textContent = r;
    const cc = document.getElementById('callCount'); if(cc) cc.textContent = r;
    const tc = document.getElementById('turnCd'); if(tc) tc.textContent = r;
    pill.style.color = (dl && r<=5) ? '#ff9c92' : '';
  };
  tick();
  if(dl) cdTimer = setInterval(tick, 300);
}

function toggle(id, show){ const el=document.getElementById(id); if(el) el.classList.toggle('show', !!show); }
function phaseName(p){
  return { waiting:'等待准备', selecting:'选择阶段', calling:'叫牌阶段', playing:'出牌阶段', settling:'结算' }[p] || p || '';
}

// ===================== 积分榜导出 / 历史战绩 =====================
// 说明：房间分数本来只在服务端内存里，房间解散就没了。
// 现在服务端每局结算都落盘一份存档，房主可随时导出；房间没了也能凭房间号找回。
let lastReport = null;

function showExport(rep){
  if(!rep) return;
  lastReport = rep;
  document.getElementById('expMeta').textContent = [rep.roomId, rep.rounds + '局'].filter(Boolean).join(' · ');
  // 标题区直接给出「我」的成绩：不用在一堆名字里找自己
  const my = rep.my;
  const myTxt = my
    ? ('我的总分 ' + (my.score>=0?'+':'') + my.score + ' · 第 ' + my.rank + '/' + my.players + ' 名')
    : '本房没有你的积分记录';
  document.getElementById('expSub').textContent = myTxt + (my ? ' · 可复制或存成 txt' : '');
  const rows = rep.rows || [];
  document.getElementById('expRows').innerHTML = rows.length ? rows.map(r=>
    '<div class="exp-row'+(r.score>0?' up':(r.score<0?' down':''))+(r.isMe?' me':'')+'">'+
      '<span class="rk">'+r.rank+'</span>'+
      '<span class="nm">'+esc(r.name)+(r.isBot?'<i class="tag">机器人</i>':'')+(r.isHost?'<i class="tag">房主</i>':'')+(r.isMe?'<i class="tag me">我</i>':'')+'</span>'+
      '<span class="sc">'+(r.score>=0?'+':'')+r.score+'</span>'+
    '</div>').join('') : '<div class="exp-empty">本房还没有积分记录</div>';
  toggle('exportBox', true);
}
function hhmm(ts){
  const d = new Date(ts); const p = n => (n<10?'0':'')+n;
  return p(d.getHours())+':'+p(d.getMinutes());
}
function copyText(text){
  const done = ()=> toast('已复制，可直接粘贴到微信');
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
      return;
    }
  } catch(e){}
  fallback();
  function fallback(){
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? done() : prompt('复制这段积分榜', text);
    } catch(e){ prompt('复制这段积分榜', text); }
  }
}
function saveText(name, text){
  try {
    const blob = new Blob(['\ufeff'+text], { type:'text/plain;charset=utf-8' });  // BOM：Windows 记事本不乱码
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('已保存 ' + name);
  } catch(e){ prompt('复制这段积分榜', text); }
}
document.getElementById('btnExpCopy').onclick = ()=>{ if(lastReport) copyText(lastReport.text); };
document.getElementById('btnExpSave').onclick = ()=>{
  if(!lastReport) return;
  const d = new Date(); const p = n => (n<10?'0':'')+n;
  saveText('积分榜-' + lastReport.roomId + '-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.txt', lastReport.text);
};
